; PlatformIO Project Configuration
; FOC Servo Driver — Industrial-Grade Closed-Loop Servo & Precision Motion Controller
; ESP32-S3 (N16R8) + AS5600 Magnetic Encoder + BTS7960 (43A H-Bridge)
; 1,000 Hz Real-Time Control Loop (FreeRTOS Core 1) · 400 kHz Fast I2C Bus

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; 16 MB Flash / 8 MB PSRAM (N16R8)
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

lib_deps =
    esphome/ESPAsyncWebServer-esphome@^3.3.0
    Wire

build_flags =
    -DCORE_DEBUG_LEVEL=0
