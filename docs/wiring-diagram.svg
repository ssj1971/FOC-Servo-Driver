<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="battGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="espGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f2440"/>
    </linearGradient>
    <linearGradient id="btsGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#5c1414"/>
    </linearGradient>
    <linearGradient id="asGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a2f"/>
      <stop offset="100%" stop-color="#0f2a1f"/>
    </linearGradient>
    <linearGradient id="motorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#525252"/>
      <stop offset="100%" stop-color="#3a3a3a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1400" height="920" rx="16" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="700" y="48" text-anchor="middle" font-size="26" font-weight="800" fill="#0f172a">SmartServo V4 Pro — Wiring Diagram</text>
  <text x="700" y="74" text-anchor="middle" font-size="14" fill="#64748b">ESP32-S3 + BTS7960 + AS5600 + 37GB-520 Motor</text>

  <!-- ========== 12V BATTERY (top-left) ========== -->
  <g transform="translate(80,120)" filter="url(#shadow)">
    <rect width="200" height="130" rx="12" fill="url(#battGrad)" stroke="#15803d" stroke-width="2"/>
    <!-- Terminal bump -->
    <rect x="55" y="-14" width="30" height="18" rx="4" fill="#ef4444"/>
    <text x="70" y="-1" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">+</text>
    <rect x="115" y="-14" width="30" height="18" rx="4" fill="#1e293b"/>
    <text x="130" y="-1" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">−</text>
    <text x="100" y="55" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">🔋 12V</text>
    <text x="100" y="78" text-anchor="middle" font-size="13" fill="#dcfce7">Battery / PSU</text>
    <text x="100" y="100" text-anchor="middle" font-size="11" fill="#bbf7d0">Size for motor stall current</text>
    <!-- Pin labels on right side -->
    <circle cx="200" cy="40" r="6" fill="#ef4444" stroke="#fff" stroke-width="1.5"/>
    <text x="192" y="44" text-anchor="end" font-size="10" font-weight="700" fill="#fff">V+</text>
    <circle cx="200" cy="90" r="6" fill="#1e293b" stroke="#fff" stroke-width="1.5"/>
    <text x="192" y="94" text-anchor="end" font-size="10" font-weight="700" fill="#fff">GND</text>
  </g>

  <!-- ========== BTS7960 MOTOR DRIVER (top-center) ========== -->
  <g transform="translate(460,100)" filter="url(#shadow)">
    <rect width="300" height="260" rx="14" fill="url(#btsGrad)" stroke="#991b1b" stroke-width="2"/>
    <rect x="10" y="10" width="280" height="36" rx="6" fill="#991b1b" opacity="0.5"/>
    <text x="150" y="35" text-anchor="middle" font-size="17" font-weight="800" fill="#fecaca">BTS7960 Motor Driver</text>
    <text x="150" y="52" text-anchor="middle" font-size="10" fill="#fca5a5">43A Dual H-Bridge</text>
    
    <!-- Left pins (input side) -->
    <circle cx="0" cy="90" r="7" fill="#fb923c" stroke="#fff" stroke-width="1.5"/>
    <text x="16" y="94" font-size="12" font-weight="700" fill="#fed7aa">RPWM</text>
    <circle cx="0" cy="130" r="7" fill="#60a5fa" stroke="#fff" stroke-width="1.5"/>
    <text x="16" y="134" font-size="12" font-weight="700" fill="#bfdbfe">LPWM</text>
    <circle cx="0" cy="170" r="7" fill="#fbbf24" stroke="#fff" stroke-width="1.5"/>
    <text x="16" y="174" font-size="12" font-weight="700" fill="#fef3c7">R_EN → 3.3V</text>
    <circle cx="0" cy="200" r="7" fill="#fbbf24" stroke="#fff" stroke-width="1.5"/>
    <text x="16" y="204" font-size="12" font-weight="700" fill="#fef3c7">L_EN → 3.3V</text>
    
    <!-- Top pins (power) -->
    <circle cx="220" cy="0" r="7" fill="#ef4444" stroke="#fff" stroke-width="1.5"/>
    <text x="220" y="-12" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">VCC 12V</text>
    <circle cx="260" cy="0" r="7" fill="#1e293b" stroke="#fff" stroke-width="1.5"/>
    <text x="260" y="-12" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">GND</text>

    <!-- Right pins (motor output) -->
    <circle cx="300" cy="120" r="7" fill="#a3a3a3" stroke="#fff" stroke-width="1.5"/>
    <text x="284" y="124" text-anchor="end" font-size="12" font-weight="700" fill="#e5e5e5">M+</text>
    <circle cx="300" cy="160" r="7" fill="#a3a3a3" stroke="#fff" stroke-width="1.5"/>
    <text x="284" y="164" text-anchor="end" font-size="12" font-weight="700" fill="#e5e5e5">M−</text>

    <!-- Big chip icon -->
    <rect x="90" y="80" width="120" height="80" rx="6" fill="#450a0a" stroke="#7f1d1d" stroke-width="1.5"/>
    <text x="150" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#f87171">BTS7960B</text>
    <text x="150" y="135" text-anchor="middle" font-size="10" fill="#fca5a5">×2 Half-Bridge</text>
    
    <!-- Heatsink lines -->
    <line x1="90" y1="170" x2="210" y2="170" stroke="#7f1d1d" stroke-width="1"/>
    <line x1="90" y1="178" x2="210" y2="178" stroke="#7f1d1d" stroke-width="1"/>
    <line x1="90" y1="186" x2="210" y2="186" stroke="#7f1d1d" stroke-width="1"/>
    <text x="150" y="210" text-anchor="middle" font-size="9" fill="#fca5a5">Heatsink</text>
  </g>

  <!-- ========== ESP32-S3 (center-bottom) ========== -->
  <g transform="translate(410,480)" filter="url(#shadow)">
    <rect width="340" height="320" rx="14" fill="url(#espGrad)" stroke="#1e40af" stroke-width="2.5"/>
    
    <!-- USB port -->
    <rect x="140" y="295" width="60" height="30" rx="4" fill="#374151" stroke="#6b7280" stroke-width="1.5"/>
    <text x="170" y="315" text-anchor="middle" font-size="9" font-weight="700" fill="#9ca3af">USB-C</text>
    
    <!-- Header -->
    <rect x="12" y="12" width="316" height="45" rx="8" fill="#1e40af" opacity="0.4"/>
    <text x="170" y="35" text-anchor="middle" font-size="18" font-weight="800" fill="#93c5fd">ESP32-S3 DevKitC-1</text>
    <text x="170" y="52" text-anchor="middle" font-size="10" fill="#60a5fa">N16R8 • Dual Core • Wi-Fi + BLE</text>

    <!-- Pin rows - Left side -->
    <text x="20" y="85" font-size="10" font-weight="700" fill="#60a5fa">LEFT PINS</text>
    
    <circle cx="0" cy="110" r="7" fill="#fb923c" stroke="#fff" stroke-width="1.5"/>
    <text x="16" y="114" font-size="13" font-weight="700" fill="#fed7aa">GPIO 14</text>
    <text x="105" y="114" font-size="10" fill="#94a3b8">→ RPWM</text>
    
    <circle cx="0" cy="145" r="7" fill="#60a5fa" stroke="#fff" stroke-width="1.5"/>
    <text x="16" y="149" font-size="13" font-weight="700" fill="#bfdbfe">GPIO 13</text>
    <text x="105" y="149" font-size="10" fill="#94a3b8">→ LPWM</text>
    
    <circle cx="0" cy="180" r="7" fill="#4ade80" stroke="#fff" stroke-width="1.5"/>
    <text x="16" y="184" font-size="13" font-weight="700" fill="#bbf7d0">GPIO 12</text>
    <text x="105" y="184" font-size="10" fill="#94a3b8">→ SDA</text>
    
    <circle cx="0" cy="215" r="7" fill="#facc15" stroke="#fff" stroke-width="1.5"/>
    <text x="16" y="219" font-size="13" font-weight="700" fill="#fef9c3">GPIO 11</text>
    <text x="105" y="219" font-size="10" fill="#94a3b8">→ SCL</text>

    <!-- Pin rows - Right side -->
    <text x="320" y="85" text-anchor="end" font-size="10" font-weight="700" fill="#60a5fa">RIGHT PINS</text>
    
    <circle cx="340" cy="110" r="7" fill="#ef4444" stroke="#fff" stroke-width="1.5"/>
    <text x="324" y="114" text-anchor="end" font-size="13" font-weight="700" fill="#fecaca">3.3V</text>
    
    <circle cx="340" cy="145" r="7" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="324" y="149" text-anchor="end" font-size="13" font-weight="700" fill="#94a3b8">GND</text>

    <!-- Chip icon -->
    <rect x="120" y="140" width="100" height="80" rx="4" fill="#0c1f3d" stroke="#1e40af" stroke-width="1.5"/>
    <text x="170" y="175" text-anchor="middle" font-size="10" font-weight="700" fill="#3b82f6">ESP32-S3</text>
    <text x="170" y="192" text-anchor="middle" font-size="9" fill="#60a5fa">240 MHz</text>
    
    <!-- Wi-Fi antenna -->
    <rect x="135" y="240" width="70" height="40" rx="20" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4"/>
    <text x="170" y="265" text-anchor="middle" font-size="9" font-weight="600" fill="#60a5fa">📡 Wi-Fi</text>
  </g>

  <!-- ========== AS5600 ENCODER (bottom-right) ========== -->
  <g transform="translate(920,520)" filter="url(#shadow)">
    <rect width="220" height="230" rx="14" fill="url(#asGrad)" stroke="#16a34a" stroke-width="2"/>
    <rect x="10" y="10" width="200" height="36" rx="6" fill="#16a34a" opacity="0.4"/>
    <text x="110" y="35" text-anchor="middle" font-size="16" font-weight="800" fill="#bbf7d0">AS5600</text>
    <text x="110" y="50" text-anchor="middle" font-size="10" fill="#86efac">12-bit Magnetic Encoder</text>

    <!-- Pins on left side -->
    <circle cx="0" cy="80" r="7" fill="#4ade80" stroke="#fff" stroke-width="1.5"/>
    <text x="16" y="84" font-size="12" font-weight="700" fill="#bbf7d0">SDA</text>
    <circle cx="0" cy="115" r="7" fill="#facc15" stroke="#fff" stroke-width="1.5"/>
    <text x="16" y="119" font-size="12" font-weight="700" fill="#fef9c3">SCL</text>
    <circle cx="0" cy="150" r="7" fill="#ef4444" stroke="#fff" stroke-width="1.5"/>
    <text x="16" y="154" font-size="12" font-weight="700" fill="#fecaca">VCC 3.3V</text>
    <circle cx="0" cy="185" r="7" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="16" y="189" font-size="12" font-weight="700" fill="#94a3b8">GND</text>

    <!-- Chip + Magnet icon -->
    <rect x="100" y="80" width="80" height="50" rx="6" fill="#052e16" stroke="#16a34a" stroke-width="1.5"/>
    <text x="140" y="102" text-anchor="middle" font-size="9" font-weight="700" fill="#4ade80">IC 0x36</text>
    <text x="140" y="118" text-anchor="middle" font-size="8" fill="#86efac">I2C 100kHz</text>
    
    <!-- Magnet indicator -->
    <circle cx="140" cy="165" r="22" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6"/>
    <text x="140" y="162" text-anchor="middle" font-size="9" font-weight="700" fill="#fbbf24">🧲 6mm</text>
    <text x="140" y="176" text-anchor="middle" font-size="8" fill="#fcd34d">Diametric</text>
    <text x="140" y="210" text-anchor="middle" font-size="9" fill="#86efac">↑ 1-3mm air gap</text>
  </g>

  <!-- ========== 37GB-520 MOTOR (top-right) ========== -->
  <g transform="translate(940,120)" filter="url(#shadow)">
    <rect width="260" height="200" rx="14" fill="url(#motorGrad)" stroke="#737373" stroke-width="2"/>
    <rect x="10" y="10" width="240" height="36" rx="6" fill="#525252" opacity="0.5"/>
    <text x="130" y="35" text-anchor="middle" font-size="16" font-weight="800" fill="#e5e5e5">⚙️ 37GB-520 Motor</text>
    <text x="130" y="52" text-anchor="middle" font-size="10" fill="#a3a3a3">DC Geared Motor • 220:1 Ratio</text>

    <!-- Motor body illustration -->
    <rect x="30" y="70" width="90" height="90" rx="8" fill="#404040" stroke="#525252" stroke-width="1.5"/>
    <circle cx="75" cy="115" r="20" fill="#2a2a2a" stroke="#525252" stroke-width="1.5"/>
    <circle cx="75" cy="115" r="8" fill="#525252"/>
    <text x="75" y="119" text-anchor="middle" font-size="7" font-weight="700" fill="#a3a3a3">37mm</text>
    
    <!-- Shaft + magnet -->
    <rect x="120" y="105" width="60" height="20" rx="4" fill="#6b7280"/>
    <text x="150" y="119" text-anchor="middle" font-size="8" font-weight="700" fill="#d4d4d8">Shaft</text>
    <circle cx="195" cy="115" r="12" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
    <text x="195" y="119" text-anchor="middle" font-size="7" font-weight="800" fill="#451a03">N|S</text>
    <text x="195" y="145" text-anchor="middle" font-size="9" fill="#d4d4d8">Magnet</text>

    <!-- Motor terminals on left -->
    <circle cx="0" cy="100" r="7" fill="#a3a3a3" stroke="#fff" stroke-width="1.5"/>
    <text x="8" y="90" font-size="10" font-weight="700" fill="#d4d4d8">M+</text>
    <circle cx="0" cy="140" r="7" fill="#a3a3a3" stroke="#fff" stroke-width="1.5"/>
    <text x="8" y="150" font-size="10" font-weight="700" fill="#d4d4d8">M−</text>
  </g>

  <!-- ==================== WIRES ==================== -->
  
  <!-- Battery V+ → BTS VCC (red) -->
  <path d="M 280 160 Q 380 100, 680 100" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
  <text x="420" y="96" font-size="10" font-weight="700" fill="#ef4444">12V +</text>
  
  <!-- Battery GND → BTS GND (black) -->
  <path d="M 280 210 Q 400 210, 500 180 Q 600 140, 720 100" fill="none" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
  <text x="500" y="176" font-size="10" font-weight="700" fill="#475569">GND</text>

  <!-- BTS M+ → Motor M+ (gray thick) -->
  <path d="M 760 220 Q 850 220, 940 220" fill="none" stroke="#a3a3a3" stroke-width="4" stroke-linecap="round"/>
  <text x="850" y="214" font-size="10" font-weight="700" fill="#6b7280">Motor +</text>
  
  <!-- BTS M− → Motor M− (gray thick) -->
  <path d="M 760 260 Q 850 260, 940 260" fill="none" stroke="#737373" stroke-width="4" stroke-linecap="round"/>
  <text x="850" y="274" font-size="10" font-weight="700" fill="#6b7280">Motor −</text>

  <!-- ESP GPIO14 → BTS RPWM (orange) -->
  <path d="M 410 590 Q 320 590, 300 500 Q 280 400, 350 300 Q 400 240, 460 190" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  <text x="295" y="395" font-size="11" font-weight="700" fill="#fb923c">GPIO 14</text>
  
  <!-- ESP GPIO13 → BTS LPWM (blue) -->
  <path d="M 410 625 Q 300 625, 280 530 Q 260 440, 340 340 Q 380 280, 460 230" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
  <text x="265" y="470" font-size="11" font-weight="700" fill="#60a5fa">GPIO 13</text>

  <!-- ESP GPIO12 → AS5600 SDA (green) -->
  <path d="M 410 660 Q 350 660, 340 680 Q 320 720, 500 730 Q 700 740, 850 680 Q 900 660, 920 600" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  <text x="620" y="748" font-size="11" font-weight="700" fill="#22c55e">SDA (GPIO 12)</text>
  
  <!-- ESP GPIO11 → AS5600 SCL (yellow) -->
  <path d="M 410 695 Q 340 695, 330 720 Q 310 760, 500 770 Q 700 780, 860 710 Q 910 685, 920 635" fill="none" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
  <text x="620" y="790" font-size="11" font-weight="700" fill="#ca8a04">SCL (GPIO 11)</text>

  <!-- ESP 3.3V → AS5600 VCC (thin red) -->
  <path d="M 750 590 Q 820 590, 860 610 Q 900 630, 920 670" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8,4"/>
  <text x="820" y="583" font-size="10" font-weight="700" fill="#ef4444">3.3V</text>

  <!-- ESP GND → AS5600 GND (thin black) -->
  <path d="M 750 625 Q 830 630, 870 660 Q 900 680, 920 705" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8,4"/>
  <text x="830" y="652" font-size="10" font-weight="700" fill="#475569">GND</text>

  <!-- Motor shaft to AS5600 magnet alignment (dashed gold) -->
  <path d="M 1135 235 Q 1135 380, 1060 420 Q 1000 450, 1060 520" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4" stroke-linecap="round"/>
  <text x="1130" y="400" font-size="10" font-weight="700" fill="#f59e0b" transform="rotate(-90,1130,400)">Magnet → Sensor</text>

  <!-- ========== LEGEND ========== -->
  <g transform="translate(50,830)">
    <rect width="1300" height="60" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="24" font-size="12" font-weight="800" fill="#334155">WIRE LEGEND:</text>
    
    <line x1="160" y1="18" x2="195" y2="18" stroke="#fb923c" stroke-width="3.5" stroke-linecap="round"/>
    <text x="202" y="22" font-size="11" fill="#334155">RPWM (GPIO 14)</text>
    
    <line x1="350" y1="18" x2="385" y2="18" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round"/>
    <text x="392" y="22" font-size="11" fill="#334155">LPWM (GPIO 13)</text>
    
    <line x1="540" y1="18" x2="575" y2="18" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round"/>
    <text x="582" y="22" font-size="11" fill="#334155">I2C SDA (GPIO 12)</text>
    
    <line x1="740" y1="18" x2="775" y2="18" stroke="#facc15" stroke-width="3.5" stroke-linecap="round"/>
    <text x="782" y="22" font-size="11" fill="#334155">I2C SCL (GPIO 11)</text>
    
    <line x1="940" y1="18" x2="975" y2="18" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
    <text x="982" y="22" font-size="11" fill="#334155">12V / 3.3V Power</text>
    
    <line x1="1120" y1="18" x2="1155" y2="18" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
    <text x="1162" y="22" font-size="11" fill="#334155">Ground</text>

    <text x="20" y="48" font-size="10" fill="#64748b">⚠️ R_EN and L_EN on BTS7960 must be tied to 3.3V (or driven HIGH) to enable the driver. All GND rails must be connected together.</text>
  </g>
</svg>
