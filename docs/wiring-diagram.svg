<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 940" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <filter id="cardShadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="espBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="btsBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="battBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="motorBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#404040"/>
    </linearGradient>
    <linearGradient id="asBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1440" height="940" rx="18" fill="#f8fafc"/>
  <rect x="20" y="20" width="1400" height="900" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <g transform="translate(60, 42)">
    <rect width="1320" height="58" rx="12" fill="#0f172a"/>
    <circle cx="34" cy="29" r="14" fill="#38bdf8"/>
    <text x="34" y="35" text-anchor="middle" font-size="16" font-weight="900" fill="#041a0d">⚡</text>
    <text x="62" y="36" font-size="20" font-weight="800" fill="#ffffff">SmartServo V5.3 — Visual Wiring Diagram</text>
    <text x="560" y="36" font-size="13" font-weight="600" fill="#94a3b8">ESP32-S3 (N16R8) · BTS7960 (43A) · AS5600 (400kHz I2C) · 37GB-520 (56:1 Fast)</text>
    
    <rect x="1170" y="14" width="130" height="30" rx="15" fill="#22c55e"/>
    <text x="1235" y="33" text-anchor="middle" font-size="11" font-weight="800" fill="#041a0d">400 kHz I2C Fast</text>
  </g>

  <!-- ==================== 1. 12V BATTERY (TOP LEFT) ==================== -->
  <g transform="translate(60, 130)" filter="url(#cardShadow)">
    <rect width="240" height="180" rx="14" fill="url(#battBg)" stroke="#15803d" stroke-width="2"/>
    <rect x="12" y="12" width="216" height="36" rx="8" fill="#14532d" opacity="0.6"/>
    <text x="120" y="35" text-anchor="middle" font-size="15" font-weight="800" fill="#86efac">🔋 12V Battery / PSU</text>
    <text x="120" y="66" text-anchor="middle" font-size="12" fill="#bbf7d0">3S LiPo or 12V 5A+ Supply</text>

    <!-- Battery Terminals -->
    <rect x="35" y="90" width="70" height="60" rx="8" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="70" y="118" text-anchor="middle" font-size="22" font-weight="900" fill="#ffffff">+</text>
    <text x="70" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#fee2e2">12V POS</text>

    <rect x="135" y="90" width="70" height="60" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="170" y="118" text-anchor="middle" font-size="22" font-weight="900" fill="#ffffff">−</text>
    <text x="170" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#cbd5e1">GND</text>
  </g>

  <!-- ==================== 2. BTS7960 MOTOR DRIVER (TOP CENTER) ==================== -->
  <g transform="translate(380, 130)" filter="url(#cardShadow)">
    <rect width="360" height="270" rx="14" fill="url(#btsBg)" stroke="#991b1b" stroke-width="2"/>
    <rect x="14" y="12" width="332" height="38" rx="8" fill="#450a0a" opacity="0.7"/>
    <text x="180" y="37" text-anchor="middle" font-size="16" font-weight="800" fill="#fecaca">BTS7960 43A Motor Driver</text>

    <!-- Top Power Terminals -->
    <rect x="230" y="60" width="50" height="34" rx="6" fill="#991b1b" stroke="#f87171" stroke-width="1"/>
    <text x="255" y="82" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">VCC</text>
    <circle cx="255" cy="56" r="6" fill="#ef4444" stroke="#fff" stroke-width="1.5"/>

    <rect x="290" y="60" width="50" height="34" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1"/>
    <text x="315" y="82" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">GND</text>
    <circle cx="315" cy="56" r="6" fill="#1e293b" stroke="#fff" stroke-width="1.5"/>

    <!-- Left Control Pins -->
    <text x="25" y="78" font-size="11" font-weight="800" fill="#fca5a5">CONTROL PINS</text>
    
    <circle cx="15" cy="100" r="7" fill="#fb923c" stroke="#fff" stroke-width="1.5"/>
    <text x="32" y="104" font-size="12" font-weight="700" fill="#fed7aa">RPWM</text>
    <text x="85" y="104" font-size="10" fill="#fca5a5">(GPIO 14)</text>

    <circle cx="15" cy="135" r="7" fill="#60a5fa" stroke="#fff" stroke-width="1.5"/>
    <text x="32" y="139" font-size="12" font-weight="700" fill="#bfdbfe">LPWM</text>
    <text x="85" y="139" font-size="10" fill="#fca5a5">(GPIO 13)</text>

    <circle cx="15" cy="170" r="7" fill="#fbbf24" stroke="#fff" stroke-width="1.5"/>
    <text x="32" y="174" font-size="12" font-weight="700" fill="#fef08a">R_EN</text>
    <text x="85" y="174" font-size="10" fill="#fef08a">→ Tie to 3.3V</text>

    <circle cx="15" cy="205" r="7" fill="#fbbf24" stroke="#fff" stroke-width="1.5"/>
    <text x="32" y="209" font-size="12" font-weight="700" fill="#fef08a">L_EN</text>
    <text x="85" y="209" font-size="10" fill="#fef08a">→ Tie to 3.3V</text>

    <circle cx="15" cy="240" r="7" fill="#1e293b" stroke="#fff" stroke-width="1.5"/>
    <text x="32" y="244" font-size="12" font-weight="700" fill="#cbd5e1">GND</text>
    <text x="85" y="244" font-size="10" fill="#94a3b8">→ Common GND</text>

    <!-- Right Motor Terminals -->
    <rect x="250" y="140" width="95" height="105" rx="8" fill="#2d0606" stroke="#7f1d1d" stroke-width="1"/>
    <text x="297" y="162" text-anchor="middle" font-size="11" font-weight="800" fill="#fca5a5">MOTOR OUT</text>
    
    <circle cx="345" cy="185" r="7" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
    <text x="330" y="189" text-anchor="end" font-size="12" font-weight="800" fill="#ffffff">M+</text>

    <circle cx="345" cy="225" r="7" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
    <text x="330" y="229" text-anchor="end" font-size="12" font-weight="800" fill="#ffffff">M−</text>
  </g>

  <!-- ==================== 3. 37GB-520 GEARED MOTOR (TOP RIGHT) ==================== -->
  <g transform="translate(860, 130)" filter="url(#cardShadow)">
    <rect width="520" height="270" rx="14" fill="url(#motorBg)" stroke="#525252" stroke-width="2"/>
    <rect x="14" y="12" width="492" height="38" rx="8" fill="#171717" opacity="0.8"/>
    <text x="260" y="37" text-anchor="middle" font-size="16" font-weight="800" fill="#f5f5f5">⚙️ 37GB-520 High-Speed DC Geared Motor</text>

    <!-- Motor Specifications Tag -->
    <rect x="25" y="60" width="220" height="26" rx="6" fill="#0284c7"/>
    <text x="135" y="77" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">56:1 Fast Ratio (Default in V5.3)</text>

    <!-- Motor Visual Body -->
    <rect x="25" y="100" width="130" height="135" rx="10" fill="#171717" stroke="#404040" stroke-width="2"/>
    <circle cx="90" cy="167" r="38" fill="#262626" stroke="#525252" stroke-width="2"/>
    <circle cx="90" cy="167" r="16" fill="#404040"/>
    <text x="90" y="172" text-anchor="middle" font-size="11" font-weight="800" fill="#a3a3a3">37mm</text>

    <!-- Motor Terminals on Left of Motor Body -->
    <circle cx="20" cy="135" r="7" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
    <text x="32" y="139" font-size="11" font-weight="800" fill="#ffffff">M+</text>
    <circle cx="20" cy="195" r="7" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
    <text x="32" y="199" font-size="11" font-weight="800" fill="#ffffff">M−</text>

    <!-- Output Shaft & Magnet -->
    <rect x="155" y="157" width="95" height="20" rx="4" fill="#a3a3a3" stroke="#737373" stroke-width="1.5"/>
    <text x="195" y="171" text-anchor="middle" font-size="10" font-weight="700" fill="#171717">Shaft 6mm D</text>

    <!-- Diametric Magnet Highlight -->
    <g transform="translate(255, 142)">
      <circle cx="25" cy="25" r="24" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
      <line x1="25" y1="1" x2="25" y2="49" stroke="#78350f" stroke-width="2"/>
      <text x="12" y="29" text-anchor="middle" font-size="12" font-weight="900" fill="#451a03">N</text>
      <text x="38" y="29" text-anchor="middle" font-size="12" font-weight="900" fill="#451a03">S</text>
      <text x="25" y="65" text-anchor="middle" font-size="11" font-weight="800" fill="#fbbf24">6mm Diametric</text>
      <text x="25" y="80" text-anchor="middle" font-size="10" fill="#fde68a">Magnet on shaft tip</text>
    </g>

    <!-- Alignment Arrow to AS5600 -->
    <path d="M 360 167 L 430 167 L 430 230" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,4"/>
    <text x="445" y="190" font-size="10" font-weight="700" fill="#f59e0b">Align to AS5600</text>
    <text x="445" y="205" font-size="9" fill="#d97706">(1–3mm Air Gap)</text>
  </g>

  <!-- ==================== 4. ESP32-S3 (BOTTOM CENTER) ==================== -->
  <g transform="translate(360, 480)" filter="url(#cardShadow)">
    <rect width="400" height="340" rx="16" fill="url(#espBg)" stroke="#2563eb" stroke-width="2.5"/>
    <rect x="14" y="12" width="372" height="42" rx="8" fill="#1e3a8a" opacity="0.6"/>
    <text x="200" y="38" text-anchor="middle" font-size="17" font-weight="800" fill="#93c5fd">ESP32-S3 DevKitC-1 (N16R8)</text>
    <text x="200" y="68" text-anchor="middle" font-size="11" fill="#60a5fa">Dual Core @ 240MHz · 400kHz I2C · ~1kHz Loop</text>

    <!-- Microcontroller Chip -->
    <rect x="150" y="130" width="100" height="90" rx="8" fill="#090d16" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="200" y="170" text-anchor="middle" font-size="12" font-weight="800" fill="#60a5fa">ESP32-S3</text>
    <text x="200" y="190" text-anchor="middle" font-size="10" fill="#93c5fd">N16R8</text>

    <!-- USB-C Port -->
    <rect x="165" y="315" width="70" height="25" rx="4" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="200" y="332" text-anchor="middle" font-size="9" font-weight="800" fill="#f8fafc">USB-C</text>

    <!-- Left Header Pins (BTS & I2C Control) -->
    <g transform="translate(15, 90)">
      <text x="10" y="0" font-size="11" font-weight="800" fill="#38bdf8">LEFT PINS</text>
      
      <!-- GPIO 14 -->
      <circle cx="0" cy="25" r="7" fill="#fb923c" stroke="#fff" stroke-width="1.5"/>
      <text x="18" y="29" font-size="13" font-weight="800" fill="#fed7aa">GPIO 14</text>
      <text x="85" y="29" font-size="11" fill="#fdba74">→ RPWM</text>

      <!-- GPIO 13 -->
      <circle cx="0" cy="65" r="7" fill="#60a5fa" stroke="#fff" stroke-width="1.5"/>
      <text x="18" y="69" font-size="13" font-weight="800" fill="#bfdbfe">GPIO 13</text>
      <text x="85" y="69" font-size="11" fill="#93c5fd">→ LPWM</text>

      <!-- GPIO 12 -->
      <circle cx="0" cy="105" r="7" fill="#4ade80" stroke="#fff" stroke-width="1.5"/>
      <text x="18" y="109" font-size="13" font-weight="800" fill="#bbf7d0">GPIO 12</text>
      <text x="85" y="109" font-size="11" fill="#86efac">→ SDA (I2C)</text>

      <!-- GPIO 11 -->
      <circle cx="0" cy="145" r="7" fill="#facc15" stroke="#fff" stroke-width="1.5"/>
      <text x="18" y="149" font-size="13" font-weight="800" fill="#fef08a">GPIO 11</text>
      <text x="85" y="149" font-size="11" fill="#fde047">→ SCL (I2C)</text>
    </g>

    <!-- Right Header Pins (Power & GND) -->
    <g transform="translate(385, 90)">
      <text x="-10" y="0" text-anchor="end" font-size="11" font-weight="800" fill="#38bdf8">RIGHT PINS</text>
      
      <!-- 3.3V Output -->
      <circle cx="0" cy="25" r="7" fill="#ef4444" stroke="#fff" stroke-width="1.5"/>
      <text x="-18" y="29" text-anchor="end" font-size="13" font-weight="800" fill="#fca5a5">3.3V OUT</text>

      <!-- GND -->
      <circle cx="0" cy="65" r="7" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
      <text x="-18" y="69" text-anchor="end" font-size="13" font-weight="800" fill="#cbd5e1">GND</text>
    </g>
  </g>

  <!-- ==================== 5. AS5600 MAGNETIC ENCODER (BOTTOM RIGHT) ==================== -->
  <g transform="translate(940, 510)" filter="url(#cardShadow)">
    <rect width="360" height="280" rx="14" fill="url(#asBg)" stroke="#16a34a" stroke-width="2"/>
    <rect x="14" y="12" width="332" height="38" rx="8" fill="#064e3b" opacity="0.8"/>
    <text x="180" y="37" text-anchor="middle" font-size="16" font-weight="800" fill="#a7f3d0">AS5600 12-Bit Magnetic Encoder</text>
    <text x="180" y="66" text-anchor="middle" font-size="11" fill="#6ee7b7">4096 Steps/Rev · 400kHz I2C · Address 0x36</text>

    <!-- Pins on Left Side -->
    <g transform="translate(20, 85)">
      <circle cx="0" cy="20" r="7" fill="#4ade80" stroke="#fff" stroke-width="1.5"/>
      <text x="18" y="24" font-size="13" font-weight="800" fill="#bbf7d0">SDA</text>
      <text x="75" y="24" font-size="11" fill="#6ee7b7">→ GPIO 12</text>

      <circle cx="0" cy="55" r="7" fill="#facc15" stroke="#fff" stroke-width="1.5"/>
      <text x="18" y="59" font-size="13" font-weight="800" fill="#fef08a">SCL</text>
      <text x="75" y="59" font-size="11" fill="#fde047">→ GPIO 11</text>

      <circle cx="0" cy="90" r="7" fill="#ef4444" stroke="#fff" stroke-width="1.5"/>
      <text x="18" y="94" font-size="13" font-weight="800" fill="#fca5a5">VCC</text>
      <text x="75" y="94" font-size="11" fill="#fca5a5">→ 3.3V (ESP32)</text>

      <circle cx="0" cy="125" r="7" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
      <text x="18" y="129" font-size="13" font-weight="800" fill="#cbd5e1">GND</text>
      <text x="75" y="129" font-size="11" fill="#94a3b8">→ Common GND</text>

      <circle cx="0" cy="160" r="6" fill="#047857" stroke="#6ee7b7" stroke-width="1.5"/>
      <text x="18" y="164" font-size="11" font-weight="700" fill="#a7f3d0">DIR</text>
      <text x="75" y="164" font-size="10" fill="#6ee7b7">GND (Normal) or Float</text>
    </g>

    <!-- AS5600 Chip Center Graphic -->
    <rect x="220" y="110" width="90" height="90" rx="8" fill="#022c22" stroke="#10b981" stroke-width="2"/>
    <circle cx="265" cy="155" r="24" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
    <text x="265" y="152" text-anchor="middle" font-size="11" font-weight="800" fill="#a7f3d0">AS5600</text>
    <text x="265" y="166" text-anchor="middle" font-size="9" fill="#6ee7b7">SENSOR</text>
    <text x="265" y="222" text-anchor="middle" font-size="10" font-weight="700" fill="#fde68a">🧲 Face to Magnet</text>
  </g>

  <!-- ==================== WIRE CONNECTIONS ==================== -->
  
  <!-- 1. 12V Battery POS (+) to BTS7960 VCC (Red thick wire) -->
  <path d="M 130 220 Q 200 160, 635 186" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <text x="250" y="165" font-size="11" font-weight="800" fill="#ef4444">12V POS (+)</text>

  <!-- 2. 12V Battery NEG (-) to BTS7960 GND (Dark gray thick wire) -->
  <path d="M 205 220 Q 300 240, 695 186" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <text x="320" y="240" font-size="11" font-weight="800" fill="#334155">GND (−)</text>

  <!-- 3. BTS7960 M+ to Motor M+ (Silver wire) -->
  <path d="M 725 315 L 880 265" fill="none" stroke="#64748b" stroke-width="4.5" stroke-linecap="round"/>
  <text x="790" y="280" font-size="11" font-weight="800" fill="#475569">MOTOR +</text>

  <!-- 4. BTS7960 M- to Motor M- (Dark silver wire) -->
  <path d="M 725 355 L 880 325" fill="none" stroke="#475569" stroke-width="4.5" stroke-linecap="round"/>
  <text x="790" y="350" font-size="11" font-weight="800" fill="#334155">MOTOR −</text>

  <!-- 5. ESP32 GPIO 14 to BTS7960 RPWM (Orange wire) -->
  <path d="M 375 605 Q 310 605, 310 390 Q 310 230, 395 230" fill="none" stroke="#fb923c" stroke-width="3.5" stroke-linecap="round"/>
  <text x="255" y="440" font-size="12" font-weight="800" fill="#ea580c">GPIO 14 → RPWM</text>

  <!-- 6. ESP32 GPIO 13 to BTS7960 LPWM (Blue wire) -->
  <path d="M 375 645 Q 330 645, 330 430 Q 330 265, 395 265" fill="none" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round"/>
  <text x="255" y="475" font-size="12" font-weight="800" fill="#2563eb">GPIO 13 → LPWM</text>

  <!-- 7. ESP32 3.3V to BTS7960 R_EN & L_EN (Amber/Yellow wire) -->
  <path d="M 745 605 Q 820 605, 820 440 Q 820 340, 700 320 Q 420 310, 395 300" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8,4"/>
  <text x="760" y="460" font-size="11" font-weight="800" fill="#d97706">3.3V → R_EN &amp; L_EN</text>

  <!-- 8. ESP32 GPIO 12 to AS5600 SDA (Green wire) -->
  <path d="M 375 685 Q 340 760, 520 840 Q 750 850, 960 615" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  <text x="640" y="860" font-size="12" font-weight="800" fill="#16a34a">SDA: GPIO 12 → AS5600 SDA</text>

  <!-- 9. ESP32 GPIO 11 to AS5600 SCL (Yellow wire) -->
  <path d="M 375 725 Q 350 790, 530 870 Q 760 880, 960 650" fill="none" stroke="#eab308" stroke-width="3" stroke-linecap="round"/>
  <text x="640" y="895" font-size="12" font-weight="800" fill="#ca8a04">SCL: GPIO 11 → AS5600 SCL</text>

  <!-- 10. ESP32 3.3V to AS5600 VCC (Red thin wire) -->
  <path d="M 745 605 Q 860 605, 960 685" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <text x="830" y="635" font-size="11" font-weight="800" fill="#dc2626">3.3V → VCC</text>

  <!-- 11. Common Ground Wire (ESP32 GND to AS5600 GND) -->
  <path d="M 745 645 Q 860 650, 960 720" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <text x="830" y="695" font-size="11" font-weight="800" fill="#334155">GND → GND</text>

  <!-- Bottom Notice Card -->
  <g transform="translate(60, 840)">
    <rect width="520" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="15" y="24" font-size="12" font-weight="800" fill="#0f172a">⚠️ CRITICAL HARDWARE CHECKS:</text>
    <text x="15" y="44" font-size="10.5" fill="#475569">1. Common Ground: Connect Battery (−), BTS7960 GND, and ESP32 GND together.</text>
    <text x="15" y="56" font-size="10.5" fill="#475569">2. Driver Enable: R_EN and L_EN must receive 3.3V to turn on the BTS7960 outputs.</text>
  </g>
</svg>
