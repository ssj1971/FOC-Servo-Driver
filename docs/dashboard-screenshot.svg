<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="840" fill="url(#bg)"/>

  <!-- ===== HEADER ===== -->
  <text x="30" y="38" font-size="20" font-weight="800" fill="#e6edf7">FOC Servo Driver V5.3 (Industrial Precision Motion)</text>
  
  <!-- Badges -->
  <rect x="30" y="50" width="105" height="24" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="82" y="66" text-anchor="middle" font-size="10" font-weight="700" fill="#22c55e">I2C: OK (Rec 0)</text>
  
  <rect x="145" y="50" width="115" height="24" rx="12" fill="#1e293b" stroke="#24324c" stroke-width="1"/>
  <text x="202" y="66" text-anchor="middle" font-size="10" font-weight="700" fill="#8b9bb4">Loop: 996 Hz</text>
  
  <rect x="270" y="50" width="145" height="24" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="342" y="66" text-anchor="middle" font-size="10" font-weight="700" fill="#22c55e">⚡ LOCKED (0 PWM)</text>

  <!-- Set Zero / E-STOP buttons -->
  <rect x="1080" y="22" width="80" height="34" rx="8" fill="#22c55e"/>
  <text x="1120" y="44" text-anchor="middle" font-size="12" font-weight="700" fill="#041a0d">Set Zero</text>
  <rect x="1170" y="22" width="80" height="34" rx="8" fill="#ef4444"/>
  <text x="1210" y="44" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">E-STOP</text>

  <!-- ===== 4 METRIC CARDS ===== -->
  <!-- Card 1: Output Angle -->
  <rect x="30" y="90" width="290" height="80" rx="12" fill="#141b29" stroke="#24324c" stroke-width="1"/>
  <text x="50" y="115" font-size="10" font-weight="700" fill="#8b9bb4" letter-spacing="0.5">OUTPUT ANGLE</text>
  <text x="50" y="150" font-size="30" font-weight="800" fill="#22c55e">90.0°</text>

  <!-- Card 2: Target -->
  <rect x="335" y="90" width="290" height="80" rx="12" fill="#141b29" stroke="#24324c" stroke-width="1"/>
  <text x="355" y="115" font-size="10" font-weight="700" fill="#8b9bb4" letter-spacing="0.5">TARGET</text>
  <text x="355" y="150" font-size="30" font-weight="800" fill="#38bdf8">90.0°</text>

  <!-- Card 3: Speed -->
  <rect x="640" y="90" width="290" height="80" rx="12" fill="#141b29" stroke="#24324c" stroke-width="1"/>
  <text x="660" y="115" font-size="10" font-weight="700" fill="#8b9bb4" letter-spacing="0.5">SPEED (°/S)</text>
  <text x="660" y="150" font-size="30" font-weight="800" fill="#e6edf7">0.0</text>

  <!-- Card 4: PWM / Raw -->
  <rect x="945" y="90" width="305" height="80" rx="12" fill="#141b29" stroke="#24324c" stroke-width="1"/>
  <text x="965" y="115" font-size="10" font-weight="700" fill="#8b9bb4" letter-spacing="0.5">PWM / I2C RAW</text>
  <text x="965" y="150" font-size="30" font-weight="800" fill="#22c55e">0 <tspan fill="#8b9bb4" font-size="18">/ 2048 (0 PWM Silent)</tspan></text>

  <!-- ===== LIVE GRAPH CARD ===== -->
  <rect x="30" y="185" width="1220" height="185" rx="12" fill="#141b29" stroke="#24324c" stroke-width="1"/>
  <text x="50" y="210" font-size="11" fill="#8b9bb4">Live Graph (</text>
  <text x="128" y="210" font-size="11" font-weight="700" fill="#38bdf8">Target</text>
  <text x="166" y="210" font-size="11" fill="#8b9bb4"> vs </text>
  <text x="184" y="210" font-size="11" font-weight="700" fill="#22c55e">Actual</text>
  <text x="222" y="210" font-size="11" fill="#8b9bb4"> • Fast 56:1 Trapezoidal Ramp)</text>
  <text x="1200" y="210" text-anchor="end" font-size="11" fill="#8b9bb4">Motor Turns: 14.0</text>
  
  <!-- Graph background -->
  <rect x="50" y="220" width="1180" height="135" rx="8" fill="#070a10" stroke="#24324c" stroke-width="1"/>
  <!-- Grid center line -->
  <line x1="50" y1="287" x2="1230" y2="287" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Target line (cyan) - crisp acceleration profile from 0 to 90 deg -->
  <polyline points="50,335 180,335 220,330 320,270 420,245 1230,245" 
            fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Actual line (green) - follows closely with feedforward, zero overshoot, locks at 90 -->
  <polyline points="50,335 180,335 225,328 325,272 410,247 440,245 1230,245" 
            fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- ===== TAB NAVIGATION ===== -->
  <rect x="30" y="388" width="145" height="38" rx="8" fill="#0f172a" stroke="#24324c" stroke-width="1"/>
  <text x="102" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf7">Control</text>
  
  <rect x="185" y="388" width="165" height="38" rx="8" fill="#38bdf8"/>
  <text x="267" y="412" text-anchor="middle" font-size="13" font-weight="800" fill="#06121f">PID &amp; Auto-Tune</text>
  
  <rect x="360" y="388" width="145" height="38" rx="8" fill="#0f172a" stroke="#24324c" stroke-width="1"/>
  <text x="432" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf7">Calibration</text>
  
  <rect x="515" y="388" width="145" height="38" rx="8" fill="#0f172a" stroke="#24324c" stroke-width="1"/>
  <text x="587" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf7">Hardware (56:1)</text>

  <!-- ===== PID & AUTO-TUNE TAB CONTENT ===== -->
  <rect x="30" y="440" width="1220" height="380" rx="12" fill="#141b29" stroke="#24324c" stroke-width="1"/>
  
  <!-- Auto-PID Box -->
  <text x="50" y="468" font-size="10" font-weight="700" fill="#8b9bb4" letter-spacing="0.5">7-STAGE FAST AUTO-PID (~30s: FRICTION + BACKLASH + KFF + ACCEL + CRISP STEPS + SPEED PID + 0-PWM LOCK)</text>
  
  <rect x="50" y="480" width="1180" height="38" rx="8" fill="#090e18" stroke="#24324c" stroke-width="1"/>
  <text x="65" y="504" font-size="12" font-family="monospace" fill="#22c55e">✓ FAST 30s TUNE OK! P:7.5 I:0.15 D:0.12 FF:0.55 | Rise:142ms | 0-PWM Silent Lock Verified</text>
  
  <!-- Progress bar (100%) -->
  <rect x="50" y="526" width="1180" height="8" rx="4" fill="#090e18" stroke="#24324c" stroke-width="1"/>
  <rect x="50" y="526" width="1180" height="8" rx="4" fill="#22c55e"/>

  <!-- Buttons -->
  <rect x="50" y="544" width="340" height="38" rx="8" fill="#f59e0b"/>
  <text x="220" y="568" text-anchor="middle" font-size="12" font-weight="800" fill="#1f1300">START 30s FAST AUTO-PID</text>
  
  <rect x="405" y="544" width="220" height="38" rx="8" fill="#ef4444"/>
  <text x="515" y="568" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">RESET PID DEFAULT (56:1)</text>

  <!-- Left Column: PID Parameters -->
  <text x="50" y="612" font-size="11" font-weight="700" fill="#8b9bb4">Angle Lock PID + Feedforward</text>

  <!-- Parameter Rows -->
  <text x="50" y="640" font-size="12" fill="#8b9bb4">Pos Kp (Stiffness)</text>
  <rect x="220" y="622" width="120" height="28" rx="6" fill="#090e18" stroke="#24324c" stroke-width="1"/>
  <text x="280" y="641" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf7">7.50</text>

  <text x="50" y="675" font-size="12" fill="#8b9bb4">Pos Ki (Steady Lock)</text>
  <rect x="220" y="657" width="120" height="28" rx="6" fill="#090e18" stroke="#24324c" stroke-width="1"/>
  <text x="280" y="676" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf7">0.15</text>

  <text x="50" y="710" font-size="12" fill="#8b9bb4">Pos Kd (Vel Damping)</text>
  <rect x="220" y="692" width="120" height="28" rx="6" fill="#090e18" stroke="#24324c" stroke-width="1"/>
  <text x="280" y="711" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf7">0.12</text>

  <text x="50" y="745" font-size="12" fill="#8b9bb4">Feedforward Kff</text>
  <rect x="220" y="727" width="120" height="28" rx="6" fill="#090e18" stroke="#24324c" stroke-width="1"/>
  <text x="280" y="746" text-anchor="middle" font-size="13" font-weight="700" fill="#38bdf8">0.55</text>

  <!-- Middle Column: Motion Limits -->
  <text x="420" y="612" font-size="11" font-weight="700" fill="#8b9bb4">Motion Profile Limits</text>

  <text x="420" y="640" font-size="12" fill="#8b9bb4">Accel Limit (°/s²)</text>
  <rect x="580" y="622" width="120" height="28" rx="6" fill="#090e18" stroke="#24324c" stroke-width="1"/>
  <text x="640" y="641" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf7">900</text>

  <text x="420" y="675" font-size="12" fill="#8b9bb4">PWM Slew (Response)</text>
  <rect x="580" y="657" width="120" height="28" rx="6" fill="#090e18" stroke="#24324c" stroke-width="1"/>
  <text x="640" y="676" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf7">24</text>

  <text x="420" y="710" font-size="12" fill="#8b9bb4">Deadzone Tol (°)</text>
  <rect x="580" y="692" width="120" height="28" rx="6" fill="#090e18" stroke="#24324c" stroke-width="1"/>
  <text x="640" y="711" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf7">0.50</text>

  <!-- Right Column: Speed Mode PID -->
  <text x="780" y="612" font-size="11" font-weight="700" fill="#8b9bb4">Speed Mode &amp; Filtering</text>

  <text x="780" y="640" font-size="12" fill="#8b9bb4">Speed Kp</text>
  <rect x="940" y="622" width="120" height="28" rx="6" fill="#090e18" stroke="#24324c" stroke-width="1"/>
  <text x="1000" y="641" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf7">1.40</text>

  <text x="780" y="675" font-size="12" fill="#8b9bb4">Speed Ki</text>
  <rect x="940" y="657" width="120" height="28" rx="6" fill="#090e18" stroke="#24324c" stroke-width="1"/>
  <text x="1000" y="676" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf7">2.50</text>

  <text x="780" y="710" font-size="12" fill="#8b9bb4">Vel Filter Alpha</text>
  <rect x="940" y="692" width="120" height="28" rx="6" fill="#090e18" stroke="#24324c" stroke-width="1"/>
  <text x="1000" y="711" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf7">0.30</text>

  <!-- Save button across bottom -->
  <rect x="50" y="770" width="1180" height="38" rx="8" fill="#22c55e"/>
  <text x="640" y="794" text-anchor="middle" font-size="13" font-weight="800" fill="#041a0d">APPLY &amp; SAVE TO FLASH (NVS)</text>
</svg>
