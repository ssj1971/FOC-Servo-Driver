<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg)"/>

  <!-- ===== HEADER ===== -->
  <text x="30" y="38" font-size="20" font-weight="800" fill="#e6edf7">SmartServo V4 Pro (I2C 100kHz)</text>
  
  <!-- Badges -->
  <rect x="30" y="50" width="90" height="24" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="75" y="66" text-anchor="middle" font-size="10" font-weight="700" fill="#22c55e">I2C: OK</text>
  
  <rect x="130" y="50" width="110" height="24" rx="12" fill="#1e293b" stroke="#24324c" stroke-width="1"/>
  <text x="185" y="66" text-anchor="middle" font-size="10" font-weight="700" fill="#8b9bb4">Loop: 498 Hz</text>
  
  <rect x="250" y="50" width="130" height="24" rx="12" fill="#1e293b" stroke="#24324c" stroke-width="1"/>
  <text x="315" y="66" text-anchor="middle" font-size="10" font-weight="700" fill="#8b9bb4">Mode: ANGLE LOCK</text>

  <!-- Set Zero / E-STOP buttons -->
  <rect x="1080" y="22" width="80" height="34" rx="8" fill="#22c55e"/>
  <text x="1120" y="44" text-anchor="middle" font-size="12" font-weight="700" fill="#041a0d">Set Zero</text>
  <rect x="1170" y="22" width="80" height="34" rx="8" fill="#ef4444"/>
  <text x="1210" y="44" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">E-STOP</text>

  <!-- ===== 4 METRIC CARDS ===== -->
  <!-- Card 1: Output Angle -->
  <rect x="30" y="90" width="290" height="80" rx="12" fill="#141b29" stroke="#24324c" stroke-width="1"/>
  <text x="50" y="115" font-size="10" font-weight="700" fill="#8b9bb4" letter-spacing="0.5">OUTPUT ANGLE</text>
  <text x="50" y="150" font-size="30" font-weight="800" fill="#22c55e">45.2°</text>

  <!-- Card 2: Target -->
  <rect x="335" y="90" width="290" height="80" rx="12" fill="#141b29" stroke="#24324c" stroke-width="1"/>
  <text x="355" y="115" font-size="10" font-weight="700" fill="#8b9bb4" letter-spacing="0.5">TARGET</text>
  <text x="355" y="150" font-size="30" font-weight="800" fill="#38bdf8">90.0°</text>

  <!-- Card 3: Speed -->
  <rect x="640" y="90" width="290" height="80" rx="12" fill="#141b29" stroke="#24324c" stroke-width="1"/>
  <text x="660" y="115" font-size="10" font-weight="700" fill="#8b9bb4" letter-spacing="0.5">SPEED (°/S)</text>
  <text x="660" y="150" font-size="30" font-weight="800" fill="#e6edf7">12.3</text>

  <!-- Card 4: PWM / Raw -->
  <rect x="945" y="90" width="305" height="80" rx="12" fill="#141b29" stroke="#24324c" stroke-width="1"/>
  <text x="965" y="115" font-size="10" font-weight="700" fill="#8b9bb4" letter-spacing="0.5">PWM / I2C RAW</text>
  <text x="965" y="150" font-size="30" font-weight="800" fill="#e6edf7">87 / 2048</text>

  <!-- ===== LIVE GRAPH CARD ===== -->
  <rect x="30" y="185" width="1220" height="195" rx="12" fill="#141b29" stroke="#24324c" stroke-width="1"/>
  <text x="50" y="210" font-size="11" fill="#8b9bb4">Live Graph (</text>
  <text x="128" y="210" font-size="11" font-weight="700" fill="#38bdf8">Target</text>
  <text x="166" y="210" font-size="11" fill="#8b9bb4"> vs </text>
  <text x="184" y="210" font-size="11" font-weight="700" fill="#22c55e">Actual</text>
  <text x="222" y="210" font-size="11" fill="#8b9bb4">)</text>
  <text x="1200" y="210" text-anchor="end" font-size="11" fill="#8b9bb4">Motor Turns: 54.8</text>
  
  <!-- Graph background -->
  <rect x="50" y="220" width="1180" height="145" rx="8" fill="#070a10" stroke="#24324c" stroke-width="1"/>
  <!-- Grid line -->
  <line x1="50" y1="292" x2="1230" y2="292" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Target line (cyan) - step profile going to 90 -->
  <polyline points="50,340 150,340 180,340 200,330 250,290 300,260 400,255 500,255 600,255 700,255 800,255 900,255 1000,255 1100,255 1200,255 1230,255" 
            fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Actual line (green) - follows with overshoot/settling -->
  <polyline points="50,340 150,340 180,338 200,325 250,280 300,245 350,240 400,250 450,258 500,254 550,255 600,255 650,255 700,255 750,255 800,255 850,255 900,255 1000,255 1100,255 1200,255 1230,255" 
            fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- ===== TAB NAVIGATION ===== -->
  <rect x="30" y="398" width="145" height="38" rx="8" fill="#38bdf8"/>
  <text x="102" y="422" text-anchor="middle" font-size="13" font-weight="800" fill="#06121f">Control</text>
  
  <rect x="185" y="398" width="145" height="38" rx="8" fill="#0f172a" stroke="#24324c" stroke-width="1"/>
  <text x="258" y="422" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf7">PID & Motion</text>
  
  <rect x="340" y="398" width="145" height="38" rx="8" fill="#0f172a" stroke="#24324c" stroke-width="1"/>
  <text x="413" y="422" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf7">Calibration</text>
  
  <rect x="495" y="398" width="145" height="38" rx="8" fill="#0f172a" stroke="#24324c" stroke-width="1"/>
  <text x="568" y="422" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf7">Hardware</text>

  <!-- ===== CONTROL TAB CONTENT ===== -->
  <rect x="30" y="450" width="1220" height="330" rx="12" fill="#141b29" stroke="#24324c" stroke-width="1"/>
  
  <!-- Mode Label -->
  <text x="50" y="478" font-size="10" font-weight="700" fill="#8b9bb4" letter-spacing="0.5">OPERATING MODE</text>
  
  <!-- Mode Buttons -->
  <rect x="50" y="490" width="140" height="36" rx="8" fill="#0f172a" stroke="#24324c" stroke-width="1"/>
  <text x="120" y="513" text-anchor="middle" font-size="12" font-weight="700" fill="#8b9bb4">IDLE</text>
  
  <rect x="200" y="490" width="160" height="36" rx="8" fill="#38bdf8"/>
  <text x="280" y="513" text-anchor="middle" font-size="12" font-weight="800" fill="#06121f">ANGLE LOCK</text>
  
  <rect x="370" y="490" width="140" height="36" rx="8" fill="#0f172a" stroke="#24324c" stroke-width="1"/>
  <text x="440" y="513" text-anchor="middle" font-size="12" font-weight="700" fill="#8b9bb4">SPEED PID</text>
  
  <rect x="520" y="490" width="160" height="36" rx="8" fill="#0f172a" stroke="#24324c" stroke-width="1"/>
  <text x="600" y="513" text-anchor="middle" font-size="12" font-weight="700" fill="#8b9bb4">MANUAL PWM</text>

  <!-- Target Angle Slider -->
  <text x="50" y="560" font-size="12" fill="#8b9bb4">Target Angle (°)</text>
  <!-- Slider track -->
  <rect x="230" y="550" width="700" height="8" rx="4" fill="#090e18" stroke="#24324c" stroke-width="1"/>
  <!-- Slider fill -->
  <rect x="230" y="550" width="525" height="8" rx="4" fill="#38bdf8" opacity="0.6"/>
  <!-- Slider thumb -->
  <circle cx="755" cy="554" r="10" fill="#38bdf8" stroke="#fff" stroke-width="2"/>
  <!-- Number input -->
  <rect x="960" y="540" width="86" height="30" rx="6" fill="#090e18" stroke="#24324c" stroke-width="1"/>
  <text x="1003" y="560" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf7">90</text>

  <!-- Preset Buttons -->
  <rect x="230" y="580" width="70" height="32" rx="8" fill="#1e293b" stroke="#24324c" stroke-width="1"/>
  <text x="265" y="600" text-anchor="middle" font-size="11" font-weight="700" fill="#e6edf7">-180°</text>
  
  <rect x="310" y="580" width="65" height="32" rx="8" fill="#1e293b" stroke="#24324c" stroke-width="1"/>
  <text x="343" y="600" text-anchor="middle" font-size="11" font-weight="700" fill="#e6edf7">-90°</text>
  
  <rect x="385" y="580" width="55" height="32" rx="8" fill="#38bdf8"/>
  <text x="413" y="600" text-anchor="middle" font-size="11" font-weight="800" fill="#06121f">0°</text>
  
  <rect x="450" y="580" width="65" height="32" rx="8" fill="#1e293b" stroke="#24324c" stroke-width="1"/>
  <text x="483" y="600" text-anchor="middle" font-size="11" font-weight="700" fill="#e6edf7">+90°</text>
  
  <rect x="525" y="580" width="70" height="32" rx="8" fill="#1e293b" stroke="#24324c" stroke-width="1"/>
  <text x="560" y="600" text-anchor="middle" font-size="11" font-weight="700" fill="#e6edf7">+180°</text>
  
  <rect x="605" y="580" width="70" height="32" rx="8" fill="#1e293b" stroke="#24324c" stroke-width="1"/>
  <text x="640" y="600" text-anchor="middle" font-size="11" font-weight="700" fill="#e6edf7">+360°</text>

  <!-- Speed Limit Slider -->
  <text x="50" y="646" font-size="12" fill="#8b9bb4">Speed Limit (°/s)</text>
  <rect x="230" y="636" width="700" height="8" rx="4" fill="#090e18" stroke="#24324c" stroke-width="1"/>
  <rect x="230" y="636" width="250" height="8" rx="4" fill="#38bdf8" opacity="0.4"/>
  <circle cx="480" cy="640" r="8" fill="#38bdf8" stroke="#fff" stroke-width="1.5"/>
  <rect x="960" y="626" width="86" height="30" rx="6" fill="#090e18" stroke="#24324c" stroke-width="1"/>
  <text x="1003" y="646" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf7">180</text>

  <!-- Max PWM Slider -->
  <text x="50" y="690" font-size="12" fill="#8b9bb4">Max PWM (Torque)</text>
  <rect x="230" y="680" width="700" height="8" rx="4" fill="#090e18" stroke="#24324c" stroke-width="1"/>
  <rect x="230" y="680" width="700" height="8" rx="4" fill="#38bdf8" opacity="0.4"/>
  <circle cx="930" cy="684" r="8" fill="#38bdf8" stroke="#fff" stroke-width="1.5"/>
  <rect x="960" y="670" width="86" height="30" rx="6" fill="#090e18" stroke="#24324c" stroke-width="1"/>
  <text x="1003" y="690" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf7">255</text>
</svg>
